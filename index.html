<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>WEBSITE OF SAKURA!</title> 
     <style> 
     body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    text-align: center;
    }
       #myImage{  
    
            display: none; 
            margin-top: 15px;
            max-width: 300px;
        }
        </style>
</head>
<body>
    
   
    <h1>שלום!</h1> // Hello in Hebrew
    <p>i suffer making this website</p>
    <button onclick="toggleImage()">Press to see a something cool</button>   
    <img id="myImage" src="https://static.wikia.nocookie.net/theunitedorganizationtoonsheroes/images/2/2a/Sakura_Haruno.png/revision/latest/scale-to-width-down/1024?cb=20211108233556" alt="Sakura Haruno">
    
    <script>
        function toggleImage() {
            var img = document.getElementById("myImage");
            
            // בדיקה האם התמונה מוסתרת או מוצגת, והפיכת המצב
            if (img.style.display === "block") {
                img.style.display = "none";  // מסתיר את התמונה
            } else {
                img.style.display = "block"; // מציג את התמונה
            } 
        }
    </script>

</body>
</html>
